services:
  postgres:
    image: postgres:17-alpine
    container_name: tone-postgres
    environment:
      POSTGRES_DB: tone
      POSTGRES_USER: tone
      POSTGRES_PASSWORD: tone_dev_password
    ports:
      - "5432:5432"
    volumes:
      - tone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tone -d tone"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tone_s3
      MINIO_ROOT_PASSWORD: tone_s3_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tone_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: tone-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tone_s3 tone_s3_secret;
      mc mb --ignore-existing local/tone-private;
      mc anonymous set none local/tone-private;
      echo 'Private S3 bucket tone-private ready (public access blocked).';
      "

volumes:
  tone_pgdata:
  tone_minio:
