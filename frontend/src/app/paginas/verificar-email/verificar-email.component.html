<section class="auth-pagina auth-pagina--centralizada" id="pagina-verificar-email">
  <div class="auth-formulario-area">
    <div class="auth-card auth-card--centrado animar-escalar">

      <!-- Logo -->
      <a routerLink="/" class="auth-card__logo-mobile" style="display:flex">
        <span class="auth-branding__logo-texto">tone</span>
        <span class="auth-branding__logo-dot"></span>
      </a>

      <!-- Estado: Carregando -->
      <div *ngIf="estado === 'carregando'" class="estado-central" id="estado-carregando">
        <div class="verificar-loader">
          <div class="spinner spinner--lg" style="border-top-color: var(--cor-texto-primario)"></div>
        </div>
        <p class="estado-central__texto">Verificando seu e-mail...</p>
      </div>

      <!-- Estado: Sucesso -->
      <div *ngIf="estado === 'sucesso'" class="estado-central animar-entrada-cima" id="estado-sucesso">
        <div class="estado-central__icone estado-central__icone--sucesso">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
        <h1 class="auth-card__titulo" style="text-align:center">E-mail verificado!</h1>
        <p class="estado-central__texto">
          Sua conta foi ativada com sucesso.<br>
          Agora você pode fazer login na plataforma.
        </p>
        <a routerLink="/login" class="btn-submit" style="text-decoration:none;justify-content:center" id="btn-ir-login-verificacao">
          Fazer Login
        </a>
      </div>

      <!-- Estado: Erro -->
      <div *ngIf="estado === 'erro'" class="estado-central animar-entrada-cima" id="estado-erro">
        <div class="estado-central__icone estado-central__icone--erro">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </div>
        <h1 class="auth-card__titulo" style="text-align:center">Link inválido</h1>
        <p class="estado-central__texto">
          Este link de verificação é inválido ou expirou.<br>
          Links são válidos por 24 horas após o cadastro.
        </p>
        <a routerLink="/cadastro" class="btn-submit btn-submit--ghost" style="text-decoration:none;justify-content:center" id="btn-novo-cadastro">
          Criar nova conta
        </a>
      </div>

    </div>
  </div>
</section>
