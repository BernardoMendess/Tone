<div class="editar-perfil container container--medio animar-entrada">
  <div class="editar-perfil__card">
    <h2 class="editar-perfil__titulo texto-gradiente">Personalizar Perfil</h2>
    <p class="editar-perfil__subtitulo">Configure sua página pública e mostre sua identidade para os compradores.</p>

    <!-- Feedbacks de erro e sucesso -->
    <div *ngIf="mensagemErro" class="alerta alerta--erro animar-entrada-cima" role="alert">
      <svg class="alerta__icone" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span class="alerta__mensagem">{{ mensagemErro }}</span>
    </div>
    <div *ngIf="mensagemSucesso" class="alerta alerta--sucesso animar-entrada-cima" role="alert">
      <svg class="alerta__icone" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      <span class="alerta__mensagem">{{ mensagemSucesso }}</span>
    </div>

    <form [formGroup]="perfilForm" (ngSubmit)="onSubmit()" novalidate>
      <!-- Upload de Imagem de Perfil -->
      <div class="campo-grupo">
        <label class="campo-label">Foto de Perfil</label>
        <div class="editar-perfil__secao-avatar">
          <div class="editar-perfil__avatar-preview-container">
            <img *ngIf="previewUrl || obterUrlCompletaFoto()" [src]="previewUrl || obterUrlCompletaFoto()" alt="Preview da Foto" class="editar-perfil__avatar-preview">
            <div *ngIf="!previewUrl && !obterUrlCompletaFoto()" class="editar-perfil__avatar-placeholder">
              {{ obterIniciais() }}
            </div>
          </div>
          <div class="editar-perfil__avatar-controles">
            <label class="btn-upload-gatilho" for="input-foto">
              Escolher Imagem
            </label>
            <input type="file" id="input-foto" class="visualmente-oculto" (change)="onFileSelected($event)" accept="image/png, image/jpeg, image/webp">
            <span class="editar-perfil__avatar-regras">JPG, PNG ou WEBP. Máx 5MB.</span>
          </div>
        </div>
      </div>

      <!-- Biografia -->
      <div class="campo-grupo">
        <label class="campo-label" for="bio">Biografia</label>
        <textarea 
          id="bio" 
          class="campo-textarea" 
          formControlName="biografia" 
          placeholder="Conte um pouco sobre sua trajetória, guitarras, amplificadores e timbres..."
          maxlength="1000">
        </textarea>
        <span class="editar-perfil__contador-caracteres" [class.editar-perfil__contador-caracteres--limite-atingido]="caracteresRestantes === 0">
          {{ caracteresRestantes }} caracteres restantes
        </span>
      </div>

      <!-- Redes Sociais -->
      <div class="campo-grupo">
        <label class="campo-label">Redes Sociais & Links (Opcionais)</label>
        <div class="editar-perfil__grid-redes-sociais">
          
          <!-- Instagram -->
          <div class="campo-grupo">
            <label class="campo-label campo-label--secundario" for="instagram-url">Instagram</label>
            <div class="campo-prefixo-wrapper">
              <span class="campo-prefixo-icone">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
              </span>
              <input 
                id="instagram-url"
                type="text" 
                class="campo-input campo-input--com-prefixo" 
                formControlName="instagramUrl" 
                placeholder="https://instagram.com/seuuser">
            </div>
          </div>

          <!-- YouTube -->
          <div class="campo-grupo">
            <label class="campo-label campo-label--secundario" for="youtube-url">YouTube</label>
            <div class="campo-prefixo-wrapper">
              <span class="campo-prefixo-icone">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 11.5a29 29 0 0 0 .46 5.08 2.78 2.78 0 0 0 1.95 1.96C5.12 19 12 19 12 19s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 11.5a29 29 0 0 0-.46-5.08z"></path><polygon points="9.75 15.02 15.5 11.5 9.75 7.98 9.75 15.02"></polygon></svg>
              </span>
              <input 
                id="youtube-url"
                type="text" 
                class="campo-input campo-input--com-prefixo" 
                formControlName="youtubeUrl" 
                placeholder="https://youtube.com/c/seucanal">
            </div>
          </div>

          <!-- SoundCloud -->
          <div class="campo-grupo">
            <label class="campo-label campo-label--secundario" for="soundcloud-url">SoundCloud</label>
            <div class="campo-prefixo-wrapper">
              <span class="campo-prefixo-icone">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
              </span>
              <input 
                id="soundcloud-url"
                type="text" 
                class="campo-input campo-input--com-prefixo" 
                formControlName="soundcloudUrl" 
                placeholder="https://soundcloud.com/seuuser">
            </div>
          </div>

          <!-- Site Pessoal -->
          <div class="campo-grupo">
            <label class="campo-label campo-label--secundario" for="site-url">Site Pessoal / Linktree</label>
            <div class="campo-prefixo-wrapper">
              <span class="campo-prefixo-icone">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
              </span>
              <input 
                id="site-url"
                type="text" 
                class="campo-input campo-input--com-prefixo" 
                formControlName="sitePessoalUrl" 
                placeholder="https://seusite.com">
            </div>
          </div>

        </div>
      </div>

      <!-- Botões de Ações -->
      <div class="editar-perfil__acoes">
        <button type="button" class="editar-perfil__btn-cancelar" (click)="cancelar()" [disabled]="statusEnvio !== 'IDLE'">
          Voltar
        </button>
        <button type="submit" class="editar-perfil__btn-salvar" [disabled]="perfilForm.invalid || statusEnvio !== 'IDLE'">
          <span *ngIf="statusEnvio !== 'IDLE'" class="spinner spinner--sm spinner--escuro"></span>
          {{ obterTextoBotao() }}
        </button>
      </div>

    </form>
  </div>
</div>
