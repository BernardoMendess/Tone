spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tone}
    username: ${DATABASE_USER:tone}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-postgres
  jpa:
    hibernate:
      ddl-auto: validate

app:
  storage:
    type: ${STORAGE_TYPE:s3}
