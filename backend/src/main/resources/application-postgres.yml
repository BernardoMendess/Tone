spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/toneguitar}
    username: ${DATABASE_USER:toneguitar}
    password: ${DATABASE_PASSWORD:toneguitar_dev_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  storage:
    type: ${STORAGE_TYPE:s3}
