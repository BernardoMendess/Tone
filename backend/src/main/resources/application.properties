spring.application.name=tone
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tonedb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=update

# Show SQL logs in development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.segredo=CHAVE_SECRETA_TEMPORARIA_DESENVOLVIMENTO_TONE_2024
jwt.expiracao=86400000

# Mail Configuration (Gmail SMTP - desenvolvimento)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=SEU_EMAIL@gmail.com
spring.mail.password=SUA_SENHA_DE_APP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App URL (para link de verificacao)
app.url=http://localhost:4200
