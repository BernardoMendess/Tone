spring.application.name=tone
server.port=8080

# Profile ativo padrao (trocar para "prod" em producao)
spring.profiles.active=dev

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tonedb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=update

# Show SQL logs in development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.segredo=${JWT_SEGREDO:CHAVE_DEV_NAO_USAR_EM_PRODUCAO_TONE_2024_XXXXXXXXXXX}
jwt.expiracao=${JWT_EXPIRACAO:86400000}

# App URL (para link de verificacao)
app.url=http://localhost:4200
