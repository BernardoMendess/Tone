server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: tone-api
  servlet:
    multipart:
      file-size-threshold: 1MB
      max-file-size: 30MB
      max-request-size: 55MB
  data:
    web:
      pageable:
        default-page-size: 24
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
  security:
    rate-limit-enabled: ${RATE_LIMIT_ENABLED:true}
  payment:
    default-take-rate-percent: ${DEFAULT_TAKE_RATE_PERCENT:15.00}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
    sandbox-enabled: ${PAYMENT_SANDBOX_ENABLED:false}
    expiration-job-delay-ms: ${PIX_EXPIRATION_JOB_DELAY_MS:60000}
    pix-merchant-name: TONE MARKETPLACE
    pix-merchant-city: SAO PAULO
    pix-key: ${PIX_KEY:pix@tone.com.br}
  payout:
    hold-period: ${PAYOUT_HOLD_PERIOD:P7D}
  upload:
    patch-extensions: ${UPLOAD_PATCH_EXTENSIONS:hlx,qcc,kipr,syx,tsl,nam,txp,wav,zip}
    max-patch-size: ${UPLOAD_MAX_PATCH_SIZE:20MB}
    max-audio-size: ${UPLOAD_MAX_AUDIO_SIZE:30MB}
  storage:
    # 'local' (private vault + HMAC presigned URLs) or 's3' (Amazon S3 / MinIO + S3Presigner)
    type: ${STORAGE_TYPE:local}
    local-root: ${STORAGE_LOCAL_ROOT:./storage/private-vault}
    presigned-ttl-seconds: ${PRESIGNED_TTL_SECONDS:300}
    signing-secret: ${STORAGE_SIGNING_SECRET}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:tone-private}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE:true}
  audio:
    target-lufs: -14.0
    max-preview-seconds: 30
    target-sample-rate: 22050
    enable-ffmpeg-if-present: true
  seed:
    enabled: ${APP_SEED_ENABLED:false}
