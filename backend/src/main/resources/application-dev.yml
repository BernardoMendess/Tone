spring:
  datasource:
    url: jdbc:h2:file:./storage/tone-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef0123456789}
    cookie-secure: false
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret-change-me-0123456789abcdef}
    sandbox-enabled: true
  storage:
    signing-secret: ${STORAGE_SIGNING_SECRET:dev-only-storage-secret-change-me-0123456789abcdef}
  seed:
    enabled: true
